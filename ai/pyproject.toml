[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai"
version = "0.1.0"
description = "BIDAR AI package: embedding, RAG, model training/inference"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1",
    "transformers>=4.51",
    "accelerate>=0.30",
    "autoawq",
    "chromadb",
    "sentence-transformers",
    "openai",
]

[tool.setuptools.packages.find]
where = ["src"]
