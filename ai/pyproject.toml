[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai"
version = "0.1.0"
description = "BIDAR AI package: embedding, RAG, model training/inference"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1",
    "transformers>=4.51",
    "accelerate>=0.30",
    "autoawq",
    # 검색(retrieval) 쪽 의존성. chromadb 는 버전을 고정한다 -
    # 낮은 버전은 높은 버전이 만든 색인을 열지 못한다(실측 2026-09-01).
    "chromadb==1.5.9",
    "sentence-transformers",
    "openai",
    "gptqmodel"
]

[tool.setuptools.packages.find]
where = ["src"]
